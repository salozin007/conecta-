<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta+ | Entrar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Conecta+</a>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-entrar">Entrar</button>
                <button type="button" class="auth-tab" id="tab-cadastrar">Cadastrar</button>
            </div>

            <form action="home.html" id="auth-form">
                <!-- CAMPO CADASTRO: Nome Completo (Oculto no Login) -->
                <div class="form-group register-field hidden-field">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Seu nome e sobrenome">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Sua senha" required>
                </div>

                <!-- CAMPO CADASTRO: Link do Projeto (Oculto no Login) -->
                <div class="form-group register-field hidden-field">
                    <label for="projeto">Seu Projeto Atual / Portfólio (Opcional)</label>
                    <input type="text" id="projeto" placeholder="Ex: Link do GitHub ou nome do projeto">
                </div>

                <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">
                    Acessar Plataforma
                </button>
            </form>
        </div>
    </div>

    <script>
        const tabEntrar = document.getElementById('tab-entrar');
        const tabCadastrar = document.getElementById('tab-cadastrar');
        const registerFields = document.querySelectorAll('.register-field');
        const btnSubmit = document.getElementById('btn-submit');
        const inputNome = document.getElementById('nome');

        // Alternar para tela de Cadastro
        tabCadastrar.addEventListener('click', () => {
            tabEntrar.classList.remove('active');
            tabCadastrar.classList.add('active');
            
            // Remove a classe que esconde os campos
            registerFields.forEach(field => field.classList.remove('hidden-field'));
            
            // Define o nome como obrigatório para o cadastro
            inputNome.setAttribute('required', 'true');
            
            // Altera o texto de ação do botão
            btnSubmit.textContent = 'Criar Minha Conta';
        });

        // Alternar para tela de Login
        tabEntrar.addEventListener('click', () => {
            tabCadastrar.classList.remove('active');
            tabEntrar.classList.add('active');
            
            // Adiciona a classe que esconde os campos
            registerFields.forEach(field => field.classList.add('hidden-field'));
            
            // Remove a obrigatoriedade do nome
            inputNome.removeAttribute('required');
            
            // Altera o texto de ação do botão de volta para o padrão
            btnSubmit.textContent = 'Acessar Plataforma';
        });
    </script>
</body>
</html>
